[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdrive-debugger"
version = "0.1.0"
description = "A powerful Python CLI and library for debugging and automating Google Drive operations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Akhil", email = "akhilsgdrive@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[project.scripts]
gdrive-debugger = "gdrive_debugger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_debugger"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]